<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10251f">
  <meta name="description" content="国学平台正在开发建设中。">
  <title>国学平台</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; color: #17221f; background: #f2f1ec; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; background: radial-gradient(ellipse at 50% 0%, #dfe9df 0%, #f2f1ec 58%); }
    main { width: min(100%, 880px); min-height: min(590px, calc(100vh - 56px)); display: flex; flex-direction: column; justify-content: space-between; padding: clamp(28px, 7vw, 76px); border: 1px solid rgba(28, 57, 46, .13); border-radius: 28px; background: rgba(255, 255, 252, .82); box-shadow: 0 24px 70px rgba(26, 47, 39, .09); }
    header { display: flex; align-items: center; gap: 12px; color: #315b49; font-size: 14px; font-weight: 650; letter-spacing: .12em; }
    .mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: #17382d; color: #f1e9d5; font-family: "Songti SC", "STSong", serif; font-size: 18px; letter-spacing: 0; }
    section { padding: 52px 0; }
    .eyebrow { margin: 0 0 18px; color: #7c886f; font-size: 12px; font-weight: 650; letter-spacing: .24em; }
    h1 { margin: 0; color: #17382d; font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif; font-size: clamp(42px, 8vw, 76px); font-weight: 500; letter-spacing: .08em; line-height: 1.18; }
    .rule { width: 48px; height: 1px; margin: 30px 0 24px; background: #bd9b5f; }
    p { margin: 0; color: #495650; font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif; font-size: clamp(17px, 2.4vw, 21px); line-height: 2; letter-spacing: .04em; }
    footer { display: flex; justify-content: space-between; gap: 16px; color: #879087; font-size: 12px; letter-spacing: .08em; }
    @media (max-width: 520px) { body { padding: 14px; } main { min-height: calc(100svh - 28px); border-radius: 20px; padding: 30px 26px; } section { padding: 42px 0; } footer { flex-direction: column; gap: 8px; } }
  </style>
</head>
<body>
  <main>
    <header><span class="mark" aria-hidden="true">文</span><span>国学平台</span></header>
    <section aria-labelledby="page-title">
      <p class="eyebrow">CLASSICAL WISDOM · DIGITAL HERITAGE</p>
      <h1 id="page-title">国学平台</h1>
      <div class="rule" aria-hidden="true"></div>
      <p>国学智慧，数字传承。<br>平台正在开发建设中，敬请期待。</p>
    </section>
    <footer><span>传承经典 · 面向未来</span><span>开发建设中</span></footer>
  </main>
</body>
</html>
